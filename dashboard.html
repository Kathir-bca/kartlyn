<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Styles/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <div class="header-search">
            <i class="fa-solid fa-magnifying-glass" style="color: rgb(0, 0, 0);"></i>
            <input type="text" placeholder="Search anything...">
        </div>
        <div class="header-notification">
            <i class="fa-solid fa-bell" style="color: rgb(0, 0, 0);"></i>
            <span class="notification-count">3</span>
        </div>
        <div class="header-profile">
            <div class="header-profile-image">
                <img src="images/luffy.jpeg" alt="Profile">
            </div>
            <div class="header-profile-name">
                <p>Kathiravan G</p>
                <span>Premium User</span>
            </div>
            <div>
                <i class="fa-solid fa-chevron-down" style="color: rgb(0, 0, 0);"></i>
            </div>
        </div>
    </header>

    <div class="side-bar">
        <div class="side-bar-logo">
            <img src="images/secure-bank.png" alt="Profile">
        </div>

        <div class="side-bar-items">
            <div class="active">
                <img src="Icons/home.png" alt="Dashboard">
                <a href="dashboard.html">Dashboard</a>
            </div>
            <div>
                <img src="Icons/account.png" alt="Accounts">
                <a href="accounts.html">Accounts</a>
            </div>
            <div>
                <img src="Icons/wallet.png" alt="Balance">
                <a href="balance.html">Balance</a>
            </div>
            <div>
                <img src="Icons/transaction.png" alt="Transactions">
                <a href="transactions.html">Transactions</a>
            </div>
            <div>
                <img src="Icons/atm-card.png" alt="Cards">
                <a href="cards.html">Cards</a>
            </div>
            <div>
                <img src="Icons/loan.png" alt="Loans">
                <a href="loans.html">Loans</a>
            </div>
            <div>
                <img src="Icons/graph.png" alt="Investments">
                <a href="investments.html">Investments</a>
            </div>
            <div>
                <img src="Icons/group.png" alt="Beneficiaries">
                <a href="beneficiaries.html">Beneficiaries</a>
            </div>
            <div>
                <img src="Icons/discount.png" alt="Offers">
                <a href="offers.html">Offers</a>
            </div>
            <div>
                <img src="Icons/user-setting.png" alt="Settings">
                <a href="profile.html">Profile & Settings</a>
            </div>
            <div>
                <img src="Icons/support.png" alt="Help & Support">
                <a href="help-support.html">Help & Support</a>
            </div>
        </div>

        <div class="side-bar-logout">
            <img src="Icons/logout.png" alt="Logout">
            <a href="index.html">Logout</a>
        </div>
    </div>
</body>

</html>
