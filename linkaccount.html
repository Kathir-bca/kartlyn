<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="styles/linkaccount.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <button type="button" id="menuToggle" class="menu-toggle" aria-label="Toggle navigation menu"
            aria-expanded="false" aria-controls="sideBar">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="header-search">
            <i class="fa-solid fa-magnifying-glass" style="color: rgb(0, 0, 0);"></i>
            <input type="text" placeholder="Search anything...">
        </div>
        <div class="header-notification">
            <i class="fa-solid fa-bell" style="color: rgb(0, 0, 0);"></i>
            <span class="notification-count">3</span>
        </div>
        <div class="header-profile">
            <div class="header-profile-image">
                <img src="images/luffy.jpeg" alt="Profile">
            </div>
            <div class="header-profile-name">
                <p>Kathiravan G</p>
                <span>Premium User</span>
            </div>
            <div>
                <i class="fa-solid fa-chevron-down" style="color: rgb(0, 0, 0);"></i>
            </div>
        </div>
    </header>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="side-bar" id="sideBar">
        <div class="side-bar-logo">
            <img src="images/secure-bank.png" alt="Profile">
        </div>

        <div class="side-bar-items">

            <div class="active">
                <img src="Icons/user-setting.png" alt="Settings">
                <a href="profile.html">Profile & Settings</a>
            </div>
            <div>
                <img src="Icons/home.png" alt="Dashboard">
                <a href="dashboard.html">Dashboard</a>
            </div>
            <div>
                <img src="Icons/account.png" alt="Accounts">
                <a href="accounts.html">Accounts</a>
            </div>
            <div>
                <img src="Icons/transaction.png" alt="Transactions">
                <a href="transactions.html">Transactions</a>
            </div>
            <div>
                <img src="Icons/atm-card.png" alt="Cards">
                <a href="cards.html">Cards</a>
            </div>
            <div>
                <img src="Icons/loan.png" alt="Loans">
                <a href="loans.html">Loans</a>
            </div>
            <div>
                <img src="Icons/group.png" alt="Beneficiaries">
                <a href="beneficiaries.html">Beneficiaries</a>
            </div>

        </div>

        <div class="side-bar-logout">
            <img src="Icons/logout.png" alt="Logout">
            <a href="index.html">Logout</a>
        </div>
    </div>

    <div class="content">
        <div class="main-content">
            <h2>Profile & Settings</h2>
            <p>Manage your profile information, preferences and account settings</p>
        </div>
        <div class="settings-options">
            <div>
                <i class="fa-regular fa-user"></i>
                <a href="profile.html">Profile Information</a>
            </div>
            <div>
                <i class="fa-solid fa-shield-halved"></i>
                <a href="securitysetting.html">Security Settings</a>
            </div>
            <div>
                <i class="fa-solid fa-sliders"></i>
                <a href="preferences.html">Preferences</a>
            </div>
            <div>
                <i class="fa-regular fa-bell"></i>
                <a href="notifications.html">Notifications</a>
            </div>
            <div class="active-option">
                <i class="fa-solid fa-link"></i>
                <a href="linkaccount.html">Linked Accounts</a>
            </div>
        </div>
        <hr>

    </div>
    <script src="script/linkaccount.js"></script>
</body>

</html>
